name: Build eFootball Painel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Instalar Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
      
      - name: Criar projeto do zero
        run: |
          export THEOS=$HOME/theos
          mkdir -p /tmp/efoot
          cd /tmp/efoot
          
          # ============ Tweak.xm com PAINEL FLUTUANTE ============
          cat > Tweak.xm << 'FIM'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          
          // PAINEL FLUTUANTE
          static UIWindow *painelWindow;
          static BOOL painelAtivo = NO;
          
          @interface PainelView : UIWindow
          @end
          
          @implementation PainelView
          
          - (instancetype)init {
              self = [super initWithFrame:CGRectMake(20, 80, 260, 350)];
              if (self) {
                  self.windowLevel = UIWindowLevelAlert + 999;
                  self.backgroundColor = [UIColor colorWithWhite:0.0 alpha:0.9];
                  self.layer.cornerRadius = 15;
                  self.layer.borderWidth = 2;
                  self.layer.borderColor = [UIColor greenColor].CGColor;
                  self.clipsToBounds = YES;
                  
                  // Título
                  UILabel *titulo = [[UILabel alloc] initWithFrame:CGRectMake(10, 10, 240, 35)];
                  titulo.text = @"⚽ EF OOTBALL ULTRA";
                  titulo.textColor = [UIColor greenColor];
                  titulo.font = [UIFont boldSystemFontOfSize:17];
                  titulo.textAlignment = NSTextAlignmentCenter;
                  [self addSubview:titulo];
                  
                  // BOTÕES
                  // 1 - Speed
                  [self adicionarBotao:@"🚀 SPEED HACK" frame:CGRectMake(10, 55, 240, 35) cor:[UIColor blueColor] acao:@selector(ativarSpeed)];
                  
                  // 2 - Força
                  [self adicionarBotao:@"💪 FORÇA DIVINA" frame:CGRectMake(10, 100, 240, 35) cor:[UIColor orangeColor] acao:@selector(ativarForca)];
                  
                  // 3 - Gol
                  [self adicionarBotao:@"⚽ GOL PERFEITO" frame:CGRectMake(10, 145, 240, 35) cor:[UIColor redColor] acao:@selector(ativarGol)];
                  
                  // 4 - Drible
                  [self adicionarBotao:@"🔄 DRIBLE TOTAL" frame:CGRectMake(10, 190, 240, 35) cor:[UIColor purpleColor] acao:@selector(ativarDrible)];
                  
                  // 5 - Goleiro
                  [self adicionarBotao:@"🧤 GOLEIRO ABSOLUTO" frame:CGRectMake(10, 235, 240, 35) cor:[UIColor greenColor] acao:@selector(ativarGoleiro)];
                  
                  // 6 - Imortal
                  [self adicionarBotao:@"💀 IMORTAL" frame:CGRectMake(10, 280, 240, 35) cor:[UIColor darkGrayColor] acao:@selector(ativarImortal)];
                  
                  // 7 - Fechar
                  UIButton *fechar = [UIButton buttonWithType:UIButtonTypeSystem];
                  fechar.frame = CGRectMake(10, 320, 240, 25);
                  fechar.backgroundColor = [UIColor redColor];
                  [fechar setTitle:@"✕ FECHAR PAINEL" forState:UIControlStateNormal];
                  [fechar setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                  fechar.titleLabel.font = [UIFont boldSystemFontOfSize:12];
                  fechar.layer.cornerRadius = 5;
                  fechar.clipsToBounds = YES;
                  [fechar addTarget:self action:@selector(fecharPainel) forControlEvents:UIControlEventTouchUpInside];
                  [self addSubview:fechar];
                  
                  // ARRASTÁVEL
                  UIPanGestureRecognizer *arrastar = [[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(arrastarPainel:)];
                  [self addGestureRecognizer:arrastar];
              }
              return self;
          }
          
          - (void)adicionarBotao:(NSString *)titulo frame:(CGRect)frame cor:(UIColor *)cor acao:(SEL)acao {
              UIButton *btn = [UIButton buttonWithType:UIButtonTypeSystem];
              btn.frame = frame;
              btn.backgroundColor = cor;
              [btn setTitle:titulo forState:UIControlStateNormal];
              [btn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              btn.titleLabel.font = [UIFont boldSystemFontOfSize:13];
              btn.layer.cornerRadius = 8;
              btn.clipsToBounds = YES;
              [btn addTarget:self action:acao forControlEvents:UIControlEventTouchUpInside];
              [self addSubview:btn];
          }
          
          - (void)arrastarPainel:(UIPanGestureRecognizer *)gesto {
              CGPoint translacao = [gesto translationInView:self];
              self.center = CGPointMake(self.center.x + translacao.x, self.center.y + translacao.y);
              [gesto setTranslation:CGPointZero inView:self];
          }
          
          - (void)ativarSpeed {
              [self mostrarAlerta:@"🚀 SPEED HACK" mensagem:@"Ativado! Velocidade máxima!"];
          }
          
          - (void)ativarForca {
              [self mostrarAlerta:@"💪 FORÇA DIVINA" mensagem:@"Ativado! Força sobre-humana!"];
          }
          
          - (void)ativarGol {
              [self mostrarAlerta:@"⚽ GOL PERFEITO" mensagem:@"Ativado! Todo chute é gol!"];
          }
          
          - (void)ativarDrible {
              [self mostrarAlerta:@"🔄 DRIBLE TOTAL" mensagem:@"Ativado! Nunca perde a bola!"];
          }
          
          - (void)ativarGoleiro {
              [self mostrarAlerta:@"🧤 GOLEIRO ABSOLUTO" mensagem:@"Ativado! Defende todas!"];
          }
          
          - (void)ativarImortal {
              [self mostrarAlerta:@"💀 IMORTAL" mensagem:@"Ativado! Nunca se machuca!"];
          }
          
          - (void)fecharPainel {
              self.hidden = YES;
          }
          
          - (void)mostrarAlerta:(NSString *)titulo mensagem:(NSString *)mensagem {
              UIAlertController *alerta = [UIAlertController alertControllerWithTitle:titulo message:mensagem preferredStyle:UIAlertControllerStyleAlert];
              [alerta addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
              [[UIApplication sharedApplication].keyWindow.rootViewController presentViewController:alerta animated:YES completion:nil];
          }
          
          @end
          
          // ============ HOOKS ============
          
          %hook PlayerController
          - (float)sprintSpeed { return 999999.0f; }
          - (float)acceleration { return 999999.0f; }
          - (float)strength { return 999999.0f; }
          - (float)balance { return 999999.0f; }
          - (float)agility { return 999999.0f; }
          - (float)stamina { return 9999999.0f; }
          - (float)bodyChecking { return 999999.0f; }
          %end
          
          %hook ShotController
          - (float)finishing { return 999999.0f; }
          - (float)shotPower { return 999999.0f; }
          - (float)shotAccuracy { return 999999.0f; }
          - (float)freekicks { return 999999.0f; }
          - (float)headers { return 999999.0f; }
          - (float)curve { return 999999.0f; }
          %end
          
          %hook DribbleController
          - (float)dribbling { return 999999.0f; }
          - (float)ballControl { return 999999.0f; }
          %end
          
          %hook JumpController
          - (float)jumping { return 999999.0f; }
          - (float)jumpHeight { return 999999.0f; }
          - (float)headingAccuracy { return 999999.0f; }
          %end
          
          %hook PassController
          - (float)shortPassing { return 999999.0f; }
          - (float)longPassing { return 999999.0f; }
          - (float)throughBallAccuracy { return 999999.0f; }
          - (float)vision { return 999999.0f; }
          - (float)crossing { return 999999.0f; }
          %end
          
          %hook GoalkeeperController
          - (float)diving { return 999999.0f; }
          - (float)handling { return 999999.0f; }
          - (float)reflexes { return 999999.0f; }
          - (float)diveReactionTime { return 0.0000001f; }
          - (float)diveRange { return 999999.0f; }
          - (float)positioning { return 999999.0f; }
          - (float)oneOnOneSaves { return 999999.0f; }
          %end
          
          %hook StaminaController
          - (float)currentStamina { return 9999999.0f; }
          - (float)staminaDrainRate { return 0.0f; }
          - (float)maxStamina { return 9999999.0f; }
          %end
          
          %hook InjuryController
          - (BOOL)canGetInjured { return NO; }
          - (float)injuryResistance { return 999999.0f; }
          %end
          
          %hook AIOpponentController
          - (float)aiReactionTime { return 999.0f; }
          - (float)aiPassAccuracy { return 0.01f; }
          - (float)aiShotAccuracy { return 0.01f; }
          - (float)aiSpeed { return 0.1f; }
          - (float)aiStrength { return 0.01f; }
          %end
          
          // MOSTRAR PAINEL QUANDO ENTRA NO JOGO
          %hook GameViewController
          - (void)viewDidAppear:(BOOL)animated {
              %orig;
              if (!painelAtivo) {
                  painelWindow = [[PainelView alloc] init];
                  [painelWindow makeKeyAndVisible];
                  painelAtivo = YES;
              } else {
                  painelWindow.hidden = NO;
              }
          }
          %end
          FIM
          
          # ============ Makefile ============
          cat > Makefile << 'FIM'
          include $(THEOS)/makefiles/common.mk
          TWEAK_NAME = eFootballUltra
          eFootballUltra_FILES = Tweak.xm
          eFootballUltra_PLIST = eFootballUltra.plist
          eFootballUltra_CFLAGS = -fobjc-arc
          include $(THEOS_MAKE_PATH)/tweak.mk
          FIM
          
          # ============ control ============
          cat > control << 'FIM'
          Package: com.hackerai.efootballultra
          Name: eFootballUltra
          Depends: mobilesubstrate
          Version: 1.0.0
          Architecture: iphoneos-arm
          Description: eFootball Ultra Hack
          Maintainer: HackerAI
          Author: HackerAI
          Section: Tweaks
          FIM
          
          # ============ plist ============
          cat > eFootballUltra.plist << 'FIM'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Filter</key>
              <dict>
                  <key>Executables</key>
                  <array>
                      <string>eFootball</string>
                  </array>
                  <key>Bundles</key>
                  <array>
                      <string>com.konami.eFootball</string>
                  </array>
              </dict>
          </dict>
          </plist>
          FIM
          
          echo "✅ ARQUIVOS CRIADOS:"
          ls -la
          
      - name: Compilar
        run: |
          export THEOS=$HOME/theos
          cd /tmp/efoot
          make package ARCHS=arm64 DEBUG=0
          echo ""
          echo "✅ ARQUIVOS GERADOS:"
          find /tmp/efoot -name "*.dylib" -o -name "*.plist" -o -name "*.deb"
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: eFootball-Painel
          path: |
            /tmp/efoot/.theos/obj/debug/arm64/eFootballUltra.dylib
            /tmp/efoot/.theos/obj/arm64/eFootballUltra.dylib
            /tmp/efoot/eFootballUltra.plist
            /tmp/efoot/packages/*.deb
          if-no-files-found: warn
